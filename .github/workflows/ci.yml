name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx vitest run
      - run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: prism-dist
          path: dist/
          retention-days: 14
